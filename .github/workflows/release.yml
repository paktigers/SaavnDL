name: Upload Release Asset

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when pushing a version tag like v1.0.0

jobs:
  build_and_release:
    name: Build & Upload Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          # Replace these lines with your actual build command 
          mkdir -p build/
          echo "Your compiled application code" > build/my-app-executable.exe

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/my-app-executable.exe
            build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
