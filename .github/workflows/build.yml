name: Build APK and publish Release
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # MP3 encoder: cross-compile LAME for Android. If this step fails the app still builds (MP3 falls back to tagged M4A).
      - name: Build LAME (MP3 encoder)
        continue-on-error: true
        run: bash scripts/build_lame.sh

      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - building with the debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ env.VERSION }}
        run: |
          TASK=assembleDebug
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; fi
          gradle $TASK --stacktrace || {
            echo "Native build failed - retrying without the MP3 encoder"
            gradle $TASK -PnoNative --stacktrace
          }
          mkdir -p out
          cp app/build/outputs/apk/*/*.apk out/SaavnDL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaavnDL-apk
          path: out/SaavnDL.apk

      # Every successful run publishes the APK as a GitHub Release (tag v1.0.<run number>).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SaavnDL v${{ env.VERSION }}
          files: out/SaavnDL.apk
          generate_release_notes: true
          make_latest: true
