name: Build APK and publish Release
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to Ubuntu 26 (different Android SDK/NDK)
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # Uploading a zip to GitHub never deletes old files. Remove the ones that were replaced in newer versions of the project,
      # otherwise the build fails with "Conflicting overloads".
      - name: Remove obsolete files
        run: |
          rm -f app/src/main/java/com/saavndl/app/ui/PlaylistScreens.kt \
                app/src/main/java/com/saavndl/app/ui/SwipeRow.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # MP3 encoder: cross-compile LAME for Android. If this step fails the app still builds (MP3 falls back to tagged M4A).
      - name: Build LAME (MP3 encoder)
        continue-on-error: true
        run: bash scripts/build_lame.sh

      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - building with the debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ env.VERSION }}
        run: |
          set -o pipefail
          TASK=assembleDebug
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; fi

          # Shows the real compiler errors in the "Annotations" box of the run (the log itself is very long).
          summarize() {
            echo "---- build failed: first errors ----"
            { grep -h "^e: " build*.log || true; } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sort -u | head -12 \
              | while IFS= read -r l; do echo "::error::${l//\%/%25}"; done
            { grep -h -A4 "What went wrong" build*.log || true; } | head -10 \
              | while IFS= read -r l; do echo "::error::${l//\%/%25}"; done
          }

          if ! gradle $TASK --stacktrace 2>&1 | tee build1.log; then
            echo "Native build failed - retrying without the MP3 encoder"
            if ! gradle $TASK -PnoNative --stacktrace 2>&1 | tee build2.log; then
              summarize
              exit 1
            fi
          fi
          mkdir -p out
          cp app/build/outputs/apk/*/*.apk out/SaavnDL.apk

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build*.log

      - uses: actions/upload-artifact@v4
        with:
          name: SaavnDL-apk
          path: out/SaavnDL.apk

      # Every successful run publishes the APK as a GitHub Release (tag v1.0.<run number>).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SaavnDL v${{ env.VERSION }}
          files: out/SaavnDL.apk
          generate_release_notes: true
          make_latest: true
